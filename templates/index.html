{% extends "base.html" %}

{% block title %}Income Tax Calculator{% endblock %}

{% block content %}
    <h1>Progressive Tax Calculator</h1>
    <p>Enter your annual taxable income below to calculate your progressive tax.</p>

    {% if error %}
        <div class="alert alert-error">
            <p>{{ error }}</p>
        </div>
    {% endif %}

    <form action="{{ url_for('calculate') }}" method="POST" class="styled-form">
        <div class="form-group">
            <label for="income">Annual Taxable Income ($):</label>
            <input type="number" step="0.01" id="income" name="income" placeholder="e.g. 52000.00" required>
        </div>
        <button type="submit" class="btn">Calculate Tax</button>
    </form>
{% endblock %}
